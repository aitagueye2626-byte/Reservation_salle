services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation-salles-app
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - reservation-network

  nginx:
    image: nginx:stable-alpine
    container_name: reservation-salles-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reservation-network

  mysql:
    image: mysql:8.0
    container_name: reservation-salles-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - reservation-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: reservation-salles-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8082:80"
    depends_on:
      - mysql
    networks:
      - reservation-network

networks:
  reservation-network:
    driver: bridge

volumes:
  mysql_data: